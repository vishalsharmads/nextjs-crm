name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DATABASE_URL_TEST: mysql://root:root@127.0.0.1:3306/crm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # MySQL installed natively on the runner (no containers).
      - uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: '8.4'
          root-password: root
          my-cnf: |
            log_bin_trust_function_creators=1
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:brand
      - name: E2E
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/crm_e2e
          NODE_ENV: development
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
